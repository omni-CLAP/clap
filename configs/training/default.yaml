# Shared TrainingConfig defaults (see clap.config.training.TrainingConfig).
# bf16, not fp32: halves the SVD UNet's memory footprint vs. full precision.
# tag/output_dir are mandatory fields with no default — every experiment file sets them.
learning_rate: 1e-5
train_batch_size: 8
gradient_accumulation_steps: 1
mixed_precision: bf16
max_train_steps: 100000
checkpointing_steps: 5000
validation_steps: 5000

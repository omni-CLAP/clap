# Post-train: continue cross_embodiment_oxe_lam_clap's cross-embodiment checkpoint, finetuned onto bridge alone.
defaults:
  - model: base
  - data: bridge
  - training: default

model:
  conditioning: ee
  action_dim: 7

training:
  tag: post_train_oxe_lam_clap_bridge
  output_dir: model_ckpt/post_train_oxe_lam_clap_bridge
  finetune_ckpt: cross_embodiment_oxe_lam_clap/checkpoint-100000.pt
  reset_action_encoder: true
